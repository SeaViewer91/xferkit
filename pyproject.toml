[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xferkit"
dynamic = ["version"]
description = "Chunked, resumable large-file upload/download SDK for Python servers (FastAPI-ready)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SeaViewer91" }]
keywords = [
    "upload",
    "download",
    "chunked-upload",
    "resumable",
    "multipart",
    "range-requests",
    "fastapi",
    "large-files",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# The server core has no third-party dependencies.
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
client = ["httpx>=0.27"]
all = ["xferkit[fastapi,client]"]
dev = [
    "xferkit[all]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "uvicorn>=0.29",
    "ruff>=0.5",
]

[project.scripts]
xferkit = "xferkit.cli:main"

[project.urls]
Homepage = "https://github.com/SeaViewer91/xferkit"
Repository = "https://github.com/SeaViewer91/xferkit"
Issues = "https://github.com/SeaViewer91/xferkit/issues"

[tool.hatch.version]
path = "src/xferkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xferkit"]

[tool.hatch.build.targets.sdist]
include = ["src/xferkit", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
