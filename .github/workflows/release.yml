# Creates a GitHub Release when a version tag (v1.2.3) is pushed: checks that
# the tag matches every version number, runs all tests, builds the wheel and
# sdist and attaches them to the release. Nothing is published to PyPI or npm
# (see RELEASING.md); install from GitHub instead:
#   pip install "xferkit[fastapi] @ git+https://github.com/SeaViewer91/xferkit.git@v1.2.3"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Versions and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Tag matches all package versions
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src tests && ruff format --check src tests
      - name: Build the browser client
        working-directory: clients/js
        run: |
          npm ci
          npm run build
      - name: Bundled browser client in the Python package is up to date
        run: git diff --exit-code src/xferkit/static/xferkit.mjs
      - name: Tests (including real Chromium)
        run: pytest -q

  release:
    name: GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and works on its own
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[all]"
          cd /tmp && /tmp/smoke/bin/python -c "import xferkit, xferkit.client, xferkit.server.s3; print(xferkit.__version__)"
          /tmp/smoke/bin/xferkit --version
      - name: Release notes from CHANGELOG.md
        run: |
          python - "${GITHUB_REF_NAME#v}" > notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(sys.argv[1])}\b.*?\n(.*?)(?=^## \d|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else "")
          EOF
          cat >> notes.md <<EOF

          ## Install

          \`\`\`
          pip install "xferkit[fastapi] @ git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_REF_NAME}"
          \`\`\`

          Browser client: \`https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/src/xferkit/static/xferkit.mjs\`
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "xferkit $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
